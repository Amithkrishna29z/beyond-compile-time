<text x="126.0" y="107.8" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >1  Get a Type</text>
<text x="126.0" y="126.4" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >typeof / GetType()</text>
<rect x="266" y="70" width="220" height="84" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="376.0" y="107.8" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >2  Ask for members</text>
<text x="376.0" y="126.4" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >GetProperties()</text>
<rect x="526" y="70" width="200" height="84" rx="9" fill="#2A2250" stroke="#A98BFF" stroke-width="1.6"/>
