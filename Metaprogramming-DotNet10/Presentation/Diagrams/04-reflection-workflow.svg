<text x="626.0" y="126.4" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >PropertyInfo[]</text>
<rect x="766" y="70" width="200" height="84" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
