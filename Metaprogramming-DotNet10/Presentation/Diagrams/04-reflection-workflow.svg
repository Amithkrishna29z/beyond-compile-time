<text x="866.0" y="126.4" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >GetValue / Invoke</text>
<rect x="1006" y="70" width="170" height="84" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="1091.0" y="117.1" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >5  Result</text>
<rect x="266" y="198" width="700" height="56" rx="9" fill="#3A2A12" stroke="#FFC24B" stroke-width="1.6"/>
<text x="616.0" y="230.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >CACHE step 3. Repeating steps 1–3 on every call is the number one reflection performance bug.</text>
