<text x="640.0" y="95.4" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >IL + METADATA</text>
<rect x="800" y="46" width="160" height="70" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="880.0" y="86.1" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >JIT</text>
