<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1288 458" width="1288" height="458" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="a-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C8DFF"/></marker>
<marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2CD8E8"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A98BFF"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F82A4"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3FD69B"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC24B"/></marker>
<marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7B7B"/></marker>
</defs>
<rect width="1288" height="458" fill="#0E1628"/>
<text x="24" y="17" fill="#6F82A4" font-size="13">MVC discovery + DI resolution: startup vs request</text>
<g transform="translate(24,32)">
<rect x="24" y="2" width="1192" height="28" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="620.0" y="21.1" fill="#6F82A4" font-size="14.2" text-anchor="middle" font-weight="600" >STARTUP  —  ONCE  ·  all the reflection happens here</text>
<rect x="24" y="36" width="230" height="72" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="139.0" y="68.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >AddControllers()</text>
<text x="139.0" y="84.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >scan for *Controller types</text>
<rect x="284" y="36" width="230" height="72" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="399.0" y="68.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >read [HttpGet] / [Route]</text>
<text x="399.0" y="84.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >attributes</text>
<rect x="544" y="36" width="250" height="72" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="669.0" y="68.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >ActionDescriptor table</text>
<text x="669.0" y="84.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >+ cached invokers</text>
<rect x="824" y="36" width="190" height="72" rx="9" fill="#2A2250" stroke="#A98BFF" stroke-width="1.6"/>
<text x="919.0" y="68.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >read constructor</text>
<text x="919.0" y="84.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >signatures  (DI)</text>
<rect x="1044" y="36" width="172" height="72" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="1130.0" y="76.2" fill="#6F82A4" font-size="11.8" text-anchor="middle" >ready to serve</text>
<rect x="24" y="138" width="1192" height="28" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="620.0" y="157.1" fill="#6F82A4" font-size="14.2" text-anchor="middle" font-weight="600" >PER REQUEST  —  NO type scanning</text>
<rect x="24" y="172" width="230" height="72" rx="9" fill="#0A1120" stroke="#2C3A5C" stroke-width="1.6"/>
<text x="139.0" y="212.2" fill="#D7E2F5" font-size="11.8" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, monospace">GET /api/reports/2</text>
<rect x="284" y="172" width="230" height="72" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="399.0" y="204.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >match the prepared</text>
<text x="399.0" y="220.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >route table</text>
<rect x="544" y="172" width="250" height="72" rx="9" fill="#2A2250" stroke="#A98BFF" stroke-width="1.6"/>
<text x="669.0" y="204.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >DI constructs the</text>
<text x="669.0" y="220.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >controller + its graph</text>
<rect x="824" y="172" width="190" height="72" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="919.0" y="212.2" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >bind parameters</text>
<rect x="1044" y="172" width="172" height="72" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="1130.0" y="204.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >invoke via a</text>
<text x="1130.0" y="220.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >CACHED delegate</text>
<rect x="24" y="268" width="1192" height="62" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="620.0" y="294.8" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >A constructor signature IS a machine-readable dependency list — that is the whole idea behind DI.</text>
<text x="620.0" y="313.4" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >DISCOVER ONCE   ·   CACHE   ·   THEN EXECUTE COMPILED CODE.</text>
<rect x="24" y="346" width="1192" height="48" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="620.0" y="374.7" fill="#6F82A4" font-size="13.0" text-anchor="middle" >Which is why “MVC and DI use reflection, so they must be slow per request” is wrong.</text>
<line x1="254.0" y1="72.0" x2="284.0" y2="72.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="514.0" y1="72.0" x2="544.0" y2="72.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="794.0" y1="72.0" x2="824.0" y2="72.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="1014.0" y1="72.0" x2="1044.0" y2="72.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="254.0" y1="208.0" x2="284.0" y2="208.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="514.0" y1="208.0" x2="544.0" y2="208.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="794.0" y1="208.0" x2="824.0" y2="208.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="1014.0" y1="208.0" x2="1044.0" y2="208.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="544.0" y1="72.0" x2="514.0" y2="208.0" stroke="#3FD69B" stroke-width="2" marker-end="url(#a-ok)"/>
</g></svg>