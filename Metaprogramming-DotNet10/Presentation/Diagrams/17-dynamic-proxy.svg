<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1288 488" width="1288" height="488" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="a-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C8DFF"/></marker>
<marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2CD8E8"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A98BFF"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F82A4"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3FD69B"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC24B"/></marker>
<marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7B7B"/></marker>
</defs>
<rect width="1288" height="488" fill="#0E1628"/>
<text x="24" y="17" fill="#6F82A4" font-size="13">Dynamic proxy method interception</text>
<g transform="translate(24,32)">
<rect x="590" y="16" width="270" height="72" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="725.0" y="48.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >BEFORE</text>
<text x="725.0" y="64.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >log · cache check · auth</text>
<rect x="900" y="16" width="280" height="72" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="1040.0" y="48.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >AFTER</text>
<text x="1040.0" y="64.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >log · timing · retry</text>
<rect x="24" y="148" width="200" height="86" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="124.0" y="187.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >caller</text>
<text x="124.0" y="203.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >holds IAccountService</text>
<rect x="274" y="128" width="260" height="126" rx="9" fill="#2A2250" stroke="#A98BFF" stroke-width="1.6"/>
<text x="404.0" y="178.5" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >generatedProxy_1</text>
<text x="404.0" y="195.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >: IAccountService</text>
<text x="404.0" y="212.8" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >: LoggingProxy</text>
<rect x="590" y="128" width="270" height="126" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="725.0" y="170.0" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >Invoke(targetMethod, args)</text>
<text x="725.0" y="204.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >ONE method sees</text>
<text x="725.0" y="221.4" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >EVERY call</text>
<rect x="900" y="148" width="280" height="86" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="1040.0" y="187.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >AccountService</text>
<text x="1040.0" y="203.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >(contains NO logging code)</text>
<rect x="24" y="288" width="1156" height="56" rx="9" fill="#3A2A12" stroke="#FFC24B" stroke-width="1.6"/>
<text x="602.0" y="320.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >Interfaces only  ·  the base proxy class must not be sealed  ·  SELF-CALLS inside the service are NOT intercepted</text>
<rect x="24" y="362" width="1156" height="52" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="602.0" y="392.7" fill="#6F82A4" font-size="13.0" text-anchor="middle" >DispatchProxy is the Part 3 generated-type pattern, packaged. It needs dynamic code — so no Native AOT.</text>
<line x1="224.0" y1="191.0" x2="274.0" y2="191.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="534.0" y1="191.0" x2="590.0" y2="191.0" stroke="#A98BFF" stroke-width="2" marker-end="url(#a-purple)"/>
<line x1="860.0" y1="191.0" x2="900.0" y2="191.0" stroke="#2CD8E8" stroke-width="2" marker-end="url(#a-accent)"/>
<line x1="725.0" y1="128.0" x2="725.0" y2="88.0" stroke="#6F82A4" stroke-width="2" marker-end="url(#a-muted)"/>
<line x1="860.0" y1="191.0" x2="900.0" y2="52.0" stroke="#6F82A4" stroke-width="2" marker-end="url(#a-muted)"/>
</g></svg>