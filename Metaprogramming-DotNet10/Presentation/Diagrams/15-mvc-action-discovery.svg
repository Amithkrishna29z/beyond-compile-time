<line x1="692.0" y1="255.0" x2="722.0" y2="255.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="938.0" y1="255.0" x2="968.0" y2="255.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="1092.0" y1="122.0" x2="1092.0" y2="216.0" stroke="#3FD69B" stroke-width="2" marker-end="url(#a-ok)"/>
</g></svg>