<marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7B7B"/></marker>
</defs>
<rect width="1288" height="488" fill="#0E1628"/>
<text x="24" y="17" fill="#6F82A4" font-size="13">ASP.NET Core MVC action discovery</text>
<g transform="translate(24,32)">
<rect x="24" y="4" width="1192" height="30" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="620.0" y="24.1" fill="#6F82A4" font-size="14.2" text-anchor="middle" font-weight="600" >STARTUP — ONCE   ·   this is where reflection happens</text>
<rect x="24" y="44" width="196" height="78" rx="9" fill="#0A1120" stroke="#2C3A5C" stroke-width="1.6"/>
<text x="122.0" y="87.7" fill="#D7E2F5" font-size="13.0" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, monospace">AddControllers()</text>
<rect x="250" y="44" width="196" height="78" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="348.0" y="79.5" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >ApplicationParts</text>
<text x="348.0" y="95.0" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >(the search path)</text>
<rect x="476" y="44" width="216" height="78" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="584.0" y="79.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >find types named</text>
<text x="584.0" y="96.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >*Controller</text>
<rect x="722" y="44" width="216" height="78" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="830.0" y="79.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >read [HttpGet]</text>
<text x="830.0" y="96.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >and [Route]</text>
<rect x="968" y="44" width="248" height="78" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="1092.0" y="79.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >ActionDescriptor table</text>
<text x="1092.0" y="96.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >+ cached invokers</text>
<rect x="24" y="176" width="1192" height="30" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="620.0" y="196.1" fill="#6F82A4" font-size="14.2" text-anchor="middle" font-weight="600" >PER REQUEST   ·   NO type scanning</text>
<rect x="24" y="216" width="196" height="78" rx="9" fill="#0A1120" stroke="#2C3A5C" stroke-width="1.6"/>
<text x="122.0" y="259.2" fill="#D7E2F5" font-size="11.8" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, monospace">GET /api/reports/2</text>
<rect x="250" y="216" width="196" height="78" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="348.0" y="251.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >match the</text>
<text x="348.0" y="268.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >prepared table</text>
<rect x="476" y="216" width="216" height="78" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="584.0" y="251.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >DI creates</text>
<text x="584.0" y="268.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >the controller</text>
<rect x="722" y="216" width="216" height="78" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="830.0" y="259.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >bind parameters</text>
<rect x="968" y="216" width="248" height="78" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="1092.0" y="251.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >invoke via a</text>
<text x="1092.0" y="268.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >CACHED delegate</text>
<rect x="24" y="338" width="1192" height="60" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="620.0" y="363.8" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >This is why “MVC uses reflection, so it must be slow per request” is wrong.</text>
<text x="620.0" y="382.4" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >DISCOVER ONCE  ·  CACHE  ·  THEN EXECUTE COMPILED CODE.</text>
