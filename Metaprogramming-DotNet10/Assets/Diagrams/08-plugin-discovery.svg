<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1288 556" width="1288" height="556" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="a-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C8DFF"/></marker>
<marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2CD8E8"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A98BFF"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F82A4"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3FD69B"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC24B"/></marker>
<marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7B7B"/></marker>
</defs>
<rect width="1288" height="556" fill="#0E1628"/>
<text x="24" y="17" fill="#6F82A4" font-size="13">Plugin discovery architecture</text>
<g transform="translate(24,32)">
<rect x="470" y="14" width="300" height="80" rx="9" fill="#2A2250" stroke="#A98BFF" stroke-width="1.6"/>
<text x="620.0" y="50.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >Contracts.dll</text>
<text x="620.0" y="67.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >IReportPlugin  +  [ReportPlugin]</text>
<rect x="50" y="140" width="340" height="180" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="220.0" y="191.8" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >HOST</text>
<text x="220.0" y="226.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >• scan plugins/ folder</text>
<text x="220.0" y="243.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >• load into a PluginLoadContext</text>
<text x="220.0" y="260.4" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >• filter: interface + attribute</text>
<text x="220.0" y="277.5" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >• ActivatorUtilities.CreateInstance</text>
<rect x="470" y="142" width="300" height="76" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="620.0" y="176.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >AssemblyLoadContext</text>
<text x="620.0" y="193.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >isCollectible: true</text>
<rect x="470" y="238" width="300" height="82" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="620.0" y="267.7" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >Contracts resolved from the</text>
<text x="620.0" y="283.2" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >DEFAULT context → the SAME</text>
<text x="620.0" y="298.8" fill="#E9EEF9" font-size="11.8" text-anchor="middle" >IReportPlugin type identity</text>
<rect x="850" y="140" width="340" height="180" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="1020.0" y="183.3" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >plugins/*.dll</text>
<text x="1020.0" y="217.5" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >MonthlySalesPlugin</text>
<text x="1020.0" y="234.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >TopCustomersPlugin</text>
<text x="1020.0" y="251.8" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >ExperimentalForecastPlugin</text>
<text x="1020.0" y="286.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >(never referenced at build time)</text>
<rect x="50" y="348" width="1140" height="56" rx="9" fill="#3A1A1E" stroke="#FF7B7B" stroke-width="1.6"/>
<text x="620.0" y="381.1" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >AssemblyLoadContext is NOT a security sandbox — it isolates TYPE IDENTITY and VERSIONS, not PRIVILEGES.</text>
<rect x="50" y="428" width="1140" height="48" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="620.0" y="456.7" fill="#6F82A4" font-size="13.0" text-anchor="middle" >1  scan   →   2  load into the ALC   →   3  filter by interface + attribute   →   4  activate   →   5  run</text>
<line x1="470.0" y1="54.0" x2="390.0" y2="230.0" stroke="#6F82A4" stroke-width="2" marker-end="url(#a-muted)"/>
<line x1="770.0" y1="54.0" x2="850.0" y2="230.0" stroke="#6F82A4" stroke-width="2" marker-end="url(#a-muted)"/>
<line x1="390.0" y1="230.0" x2="470.0" y2="180.0" stroke="#4C8DFF" stroke-width="2" marker-end="url(#a-default)"/>
<line x1="770.0" y1="180.0" x2="850.0" y2="230.0" stroke="#2CD8E8" stroke-width="2" marker-end="url(#a-accent)"/>
</g></svg>