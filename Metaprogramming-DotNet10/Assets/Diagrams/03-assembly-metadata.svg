<rect x="88" y="368" width="924" height="50" rx="9" fill="#2A2250" stroke="#A98BFF" stroke-width="1.6"/>
<text x="550.0" y="397.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >Every level above can carry CUSTOM ATTRIBUTES  ·  the CustomAttribute metadata table</text>
<rect x="24" y="470" width="1052" height="54" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="550.0" y="501.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >Metadata is REQUIRED, not optional — the CLR needs it to do its own job. That is why reflection works.</text>
