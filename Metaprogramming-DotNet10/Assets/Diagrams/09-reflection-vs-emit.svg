<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1248 448" width="1248" height="448" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<marker id="a-default" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4C8DFF"/></marker>
<marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2CD8E8"/></marker>
<marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A98BFF"/></marker>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6F82A4"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3FD69B"/></marker>
<marker id="a-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FFC24B"/></marker>
<marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#FF7B7B"/></marker>
</defs>
<rect width="1248" height="448" fill="#0E1628"/>
<text x="24" y="17" fill="#6F82A4" font-size="13">Reflection vs Reflection.Emit</text>
<g transform="translate(24,32)">
<rect x="24" y="4" width="420" height="30" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="234.0" y="24.1" fill="#6F82A4" font-size="14.2" text-anchor="middle" font-weight="600" >REFLECTION — the work repeats on every call</text>
<rect x="24" y="44" width="190" height="70" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="119.0" y="83.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >MethodInfo</text>
<rect x="254" y="44" width="260" height="70" rx="9" fill="#3A1A1E" stroke="#FF7B7B" stroke-width="1.6"/>
<text x="384.0" y="75.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >bind args + access checks</text>
<text x="384.0" y="92.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >EVERY CALL</text>
<rect x="554" y="44" width="180" height="70" rx="9" fill="#18233D" stroke="#2C3A5C" stroke-width="1.6"/>
<text x="644.0" y="83.7" fill="#9FB0CC" font-size="13.0" text-anchor="middle" >result</text>
<rect x="774" y="44" width="402" height="70" rx="9" fill="#3A2A12" stroke="#FFC24B" stroke-width="1.6"/>
<text x="975.0" y="84.1" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >≈ 7–8× direct   ·   about 33 ns per call</text>
<rect x="24" y="150" width="560" height="30" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="304.0" y="170.1" fill="#6F82A4" font-size="14.2" text-anchor="middle" font-weight="600" >CACHED DELEGATE / EMIT — the work happens once</text>
<rect x="24" y="190" width="190" height="70" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="119.0" y="229.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >MethodInfo</text>
<rect x="254" y="190" width="260" height="70" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="384.0" y="221.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >emit IL + JIT</text>
<text x="384.0" y="238.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >ONCE</text>
<rect x="554" y="190" width="180" height="70" rx="9" fill="#2A2250" stroke="#A98BFF" stroke-width="1.6"/>
<text x="644.0" y="229.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >delegate</text>
<rect x="774" y="190" width="190" height="70" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="869.0" y="229.7" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >direct call</text>
<rect x="1004" y="190" width="172" height="70" rx="9" fill="#13342A" stroke="#3FD69B" stroke-width="1.6"/>
<text x="1090.0" y="230.9" fill="#E9EEF9" font-size="16.5" text-anchor="middle" >≈ 1.2×</text>
<rect x="24" y="296" width="1152" height="60" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="600.0" y="322.1" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >Measured here: a cached delegate from MethodInfo.CreateDelegate was EXACTLY as fast as emitted IL.</text>
<text x="600.0" y="339.2" fill="#E9EEF9" font-size="13.0" text-anchor="middle" >Try CreateDelegate before writing a single OpCode.</text>
<line x1="214.0" y1="79.0" x2="254.0" y2="79.0" stroke="#FF7B7B" stroke-width="2" marker-end="url(#a-bad)"/>
<line x1="514.0" y1="79.0" x2="554.0" y2="79.0" stroke="#FF7B7B" stroke-width="2" marker-end="url(#a-bad)"/>
<line x1="214.0" y1="225.0" x2="254.0" y2="225.0" stroke="#3FD69B" stroke-width="2" marker-end="url(#a-ok)"/>
<line x1="514.0" y1="225.0" x2="554.0" y2="225.0" stroke="#3FD69B" stroke-width="2" marker-end="url(#a-ok)"/>
<line x1="734.0" y1="225.0" x2="774.0" y2="225.0" stroke="#3FD69B" stroke-width="2" marker-end="url(#a-ok)"/>
</g></svg>