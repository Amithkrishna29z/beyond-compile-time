<rect width="1248" height="438" fill="#0E1628"/>
<text x="24" y="17" fill="#6F82A4" font-size="13">Normal programming vs metaprogramming</text>
<g transform="translate(24,32)">
<rect x="30" y="6" width="530" height="34" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
