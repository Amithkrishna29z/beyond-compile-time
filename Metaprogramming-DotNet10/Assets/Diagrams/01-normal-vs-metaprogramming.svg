<rect x="70" y="56" width="450" height="62" rx="9" fill="#0A1120" stroke="#2C3A5C" stroke-width="1.6"/>
<text x="295.0" y="93.8" fill="#D7E2F5" font-size="18.9" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, monospace">customer.Email</text>
<rect x="70" y="158" width="450" height="58" rx="9" fill="#1F2C4A" stroke="#4C8DFF" stroke-width="1.6"/>
<text x="295.0" y="192.1" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >reads a VALUE</text>
<rect x="70" y="256" width="450" height="76" rx="9" fill="#18233D" stroke="#2C3A5C" stroke-width="1.6"/>
<text x="295.0" y="289.8" fill="#9FB0CC" font-size="14.2" text-anchor="middle" >Works only for Customer.</text>
<text x="295.0" y="308.4" fill="#9FB0CC" font-size="14.2" text-anchor="middle" >YOU wrote the property name.</text>
<rect x="640" y="6" width="530" height="34" rx="9" fill="none" stroke="#2C3A5C" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="905.0" y="28.1" fill="#6F82A4" font-size="14.2" text-anchor="middle" font-weight="600" >METAPROGRAMMING</text>
<rect x="680" y="56" width="450" height="62" rx="9" fill="#0A1120" stroke="#2C3A5C" stroke-width="1.6"/>
<text x="905.0" y="92.5" fill="#D7E2F5" font-size="15.3" text-anchor="middle" font-family="Consolas, SFMono-Regular, Menlo, monospace">type.GetProperty(name).GetValue(obj)</text>
<rect x="680" y="158" width="450" height="58" rx="9" fill="#1D3A6B" stroke="#2CD8E8" stroke-width="1.6"/>
<text x="905.0" y="192.1" fill="#E9EEF9" font-size="14.2" text-anchor="middle" >reads the STRUCTURE</text>
